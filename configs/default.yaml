# SyncScore default configuration. Every value here is read by syncscore/config.py.

pose:
  model: yolo11s-pose.pt      # yolo11m-pose.pt is more accurate and slower
  device: cpu                 # "cpu", or "0" for the first GPU
  min_keypoint_conf: 0.3      # below this a keypoint is treated as missing
  min_box_conf: 0.25

tracking:
  tracker: bytetrack.yaml
  members: 0                  # expected group size; 0 = infer from the most common count
  stitch_max_gap_s: 2.0       # rejoin broken tracks separated by at most this long
  crossing_iou: 0.3           # box overlap that counts as two members crossing
  fill_max_gap_s: 2.0         # fill a member's gap up to this long with real, unused detections (0 = off)
  recover: true               # also re-run the pose model on just the frames still missing someone in such a gap
  recover_conf: 0.05          # ...at this lower box threshold (a half-hidden dancer scores low)
  recover_imgsz: 1280         # ...and this larger input size

smoothing:
  min_cutoff: 1.0             # One Euro: lower = smoother when still (Hz). Tuned in docs/walkthrough.md
  beta: 1.0                   # One Euro: higher = less smoothing during fast motion (per torso length/s)
  d_cutoff: 1.0
  max_gap_frames: 4           # interpolate holes up to this long, leave longer ones missing
  repair_swaps: true          # undo sudden left/right label swaps by continuity with the last frame

features:
  mirror: "off"               # "off" | "auto" | a list of member ids to mirror, e.g. [2, 4]

sync:
  window_s: 2.0
  hop_s: 0.25
  max_lag_ms: 400
  min_motion: 0.3             # group's RMS bone angular speed (rad/s); stiller windows carry no timing
  min_peak: 0.5               # cross-correlation peak below this = no reliable offset
  min_coverage: 0.5           # share of the window in which the member must be visible
  min_margin: 0.15            # best peak must beat any separate peak by this much, else ambiguous
  lag_penalty: 0.1            # Viterbi cost per 100 ms of jump between neighbouring windows
  iterations: 10              # max align -> consensus -> re-estimate passes (stops early once stable)
  shape_threshold_deg: 15.0   # a body part counts as "off" above this angle (worst bone of the part)
  max_bone_speed_deg_s: 1800  # faster bone rotation is a pose glitch: that velocity is unknown (0 = off)

sections:
  # Either list explicit [start_s, end_s, name] sections, or leave empty for fixed chunks.
  explicit: []
  chunk_s: 32.0               # on real footage about 30 s is needed for a trustworthy reading (docs/walkthrough.md)
  min_peak: 0.2               # windows pooled into a section need only this correlation (they are not trusted alone)
  min_windows: 8              # fewer usable windows in a section = no reading
  min_blocks: 5               # ...or fewer independent (non-overlapping) stretches: the interval would be meaningless
  max_ci_ms: 50               # a 90% interval wider than this = no reading

hits:
  # Timing at the group's big simultaneous movements (syncscore/sync/hits.py). Scored by
  # `syncscore shift-test`; not used in the report (it added no reliable readings on the test
  # clip, see docs/walkthrough.md, Stage B).
  prominence: 1.5             # a group hit rises this far above its surroundings (x a member's typical speed)
  max_offset_ms: 400          # search range for each member's matching peak
  max_second_peak: 0.7        # another peak at least this high (relative) in range = a tie...
  min_agreement: 0.5          # ...won only by the peak whose movement direction agrees this well (cosine) with the others'
  min_others: 3               # other members with a matched peak needed for a reference
  min_hits: 5                 # fewer matched hits in a section = no reading from hits
  max_ci_ms: 50               # a 90% interval wider than this = no reading

render:
  in_sync_ms: 35              # |offset| at or below this is drawn green
  off_sync_ms: 135            # |offset| at or above this is drawn red
